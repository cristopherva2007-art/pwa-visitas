<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personas PWA | Proyecto base</title>

    <!-- AGREGAR TAGS PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002533">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <header class="bg-dark text-white py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Personas PWA</h1>
      </div>
    </header>

    <main class="container py-4">
      <div class="mb-4">
        <h2 class="h3">Gestión de personas</h2>
        <p class="text-secondary mb-0"><b>Conexión: </b><span
            id="onlineStatus">conectado</span></p>
      </div>

      <div class="row g-4">

        <section class="col-lg-4">

          <div class="card shadow-sm">
            <div class="card-header bg-light">
              <h3 class="h5 mb-0">Registrar persona</h3>
            </div>
            <div class="card-body">
              <form id="formPersona">
                <input type="hidden" id="id_persona" value="0">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input id="nombre" class="form-control" type="text"
                    placeholder="Ej. Ana Rodríguez" required>
                </div>
                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input id="telefono" class="form-control" type="tel"
                    placeholder="8888-1234" required>
                </div>
                <div class="mb-3">
                  <label for="correo" class="form-label">Correo
                    electrónico</label>
                  <input id="correo" class="form-control" type="email"
                    placeholder="persona@ejemplo.com" required>
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary"
                    id="btnGuardar">Guardar</button>
                  <button type="reset" class="btn btn-outline-secondary"
                    id="btn-clear">Limpiar</button>
                </div>
              </form>

            </div>
          </div>
        </section>

        <section class="col-lg-8">
          <div class="card shadow-sm">
            <div
              class="card-header bg-light d-flex justify-content-between align-items-center gap-2">
              <h3 class="h5 mb-0">Personas registradas</h3>
            </div>
            <div class="card-body">
              <div class="mb-3"><label for="buscar" class="form-label">Buscar
                  persona</label><input id="buscar"
                  class="form-control" placeholder="Buscar por nombre..."></div>

              <div class="table-responsive">
                <table
                  class="table table-bordered table-hover align-middle mb-0">
                  <thead class="table-dark">
                    <tr>
                      <th>Nombre</th>
                      <th>Teléfono</th>
                      <th>Correo</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaPersonas">
                    <tr>
                      <td>Ana Rodríguez</td>
                      <td>8888-1234</td>
                      <td>ana@ejemplo.com</td>
                      <td class="text-nowrap"><button type="button"
                          class="btn btn-sm btn-outline-primary btn-editar">Editar</button>
                        <button type="button"
                          class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button></td>
                    </tr>
                    <tr>
                      <td>Carlos Mora</td>
                      <td>8777-5678</td>
                      <td>carlos@ejemplo.com</td>
                      <td class="text-nowrap"><button type="button"
                          class="btn btn-sm btn-outline-primary btn-editar">Editar</button>
                        <button type="button"
                          class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button></td>
                    </tr>
                    <tr>
                      <td>Laura Solano</td>
                      <td>8666-9012</td>
                      <td>laura@ejemplo.com</td>
                      <td class="text-nowrap"><button type="button"
                          class="btn btn-sm btn-outline-primary btn-editar">Editar</button>
                        <button type="button"
                          class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="container py-4 text-center text-secondary small">
      <hr>
      <div class="d-flex justify-content-between gap-3">
        <p>Proyecto didáctico · Personas PWA</p>
        <p>
          <a target="_blank" class="btn btn-link"
            href="https://progressier.com/pwa-manifest-generator">Generar
            PWA</a>
          <button type="button" id="btn-test-notification"
            class="btn btn-link">Prueba Notificación</button>
        </p>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>

      //--------- PWA CONFIG ---------

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          initServiceWorker();
        });
      }

      function initServiceWorker() {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("Service worker is registered successfully"))
          .catch((error) =>
            console.error(`failed to register service worker, error: ${error}`),
          );
      }
      

    </script>

  </body>

</html>
